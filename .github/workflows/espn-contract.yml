name: ESPN contract

# Checks the real ESPN API against what the app reads. A red run means the API changed:
# look at the failed check, record a fresh sample in tests/fixtures/espn/ and fix the normalisers.
on:
  schedule:
    - cron: "17 12 * * 5"   # Fridays 09:17 in São Paulo, ahead of the weekend card
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    name: live API
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install Playwright
        run: |
          pip install -r tests/requirements.txt
          playwright install --with-deps chromium
      - name: Build the page whose parsers are checked
        run: |
          npm ci
          npm run build
      - name: Self-test of the checker
        run: python tests/contract_live.py --mock
      - name: Check the real API
        # exit 3 = this runner could not reach ESPN at all: inconclusive, reported as a warning, not as a change in the API
        run: python tests/contract_live.py || [ $? -eq 3 ]
