<style>
/* layout: one phone-width column, fight cards stacked main event first; tab bar pinned to the bottom, bet slip as a bottom sheet */
:root{
  --bg:#f2f3f5; --surface:#ffffff; --surface2:#e8ebf0; --line:#d3d8e0; --fg:#141922; --muted:#5b6474;
  --gold:#855a00; --gold-bg:#f0c24f; --on-gold:#1b1400;
  --red:#cf2f36; --blue:#2463d6;
  --win:#0b7a4c; --loss:#c22a2a; --live:#d92d20;
  --shade:rgba(10,14,20,.5);
  --font-display:"Big Shoulders Display","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --font-body:"Barlow","Helvetica Neue",Helvetica,Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0e1218; --surface:#171c25; --surface2:#222a37; --line:#2d3646; --fg:#eef1f6; --muted:#9aa4b5;
    --gold:#f0c24f; --gold-bg:#f0c24f; --on-gold:#1b1400;
    --red:#f0555b; --blue:#5b9bff;
    --win:#3fd08f; --loss:#ff7a7a; --live:#ff5a4d;
    --shade:rgba(3,5,8,.66);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 var(--font-body);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;overflow-x:hidden}
button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;cursor:pointer;-webkit-tap-highlight-color:transparent;text-align:inherit}
input,textarea{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}
h1,h2,h3,h4,p{margin:0}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top .wrap{display:flex;align-items:center;gap:10px;height:56px}
.brand{display:flex;align-items:center;gap:8px;font:800 24px/1 var(--font-display);letter-spacing:.02em;text-transform:uppercase;white-space:nowrap;flex:none}
.brand svg{width:26px;height:26px;color:var(--gold);flex:none}
.fake{font:600 10px/1 var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:4px 5px;white-space:nowrap}
@media (max-width:560px){.fake{display:none}}
.bal{margin-left:auto;text-align:right;line-height:1.15;padding:6px 0 6px 8px;min-width:0}
.bal small{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.bal b{font-size:17px;font-weight:700;white-space:nowrap}

main{padding-block:14px calc(160px + env(safe-area-inset-bottom,0px))}
.empty{color:var(--muted);padding:28px 0;text-align:center}
.h2{font:800 26px/1 var(--font-display);text-transform:uppercase;letter-spacing:.01em;margin:6px 0 12px;text-wrap:balance}
.label{font:600 11px/1.2 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* event picker */
.events{display:flex;gap:8px;overflow-x:auto;margin-inline:-16px;padding:0 16px 4px;scrollbar-width:none}
.events::-webkit-scrollbar{display:none}
.ev{flex:0 0 auto;border:1px solid var(--line);border-radius:8px;padding:9px 12px;background:var(--surface);min-width:148px;max-width:230px}
.ev small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.ev b{display:block;font:800 19px/1.05 var(--font-display);text-transform:uppercase;letter-spacing:.01em;margin:3px 0}
.ev.on{border-color:var(--gold);box-shadow:inset 0 -3px 0 var(--gold-bg)}
.sync{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;margin-block:12px 2px}
.sync span{min-width:0}
.sync button{margin-left:auto;flex:none;color:var(--fg);font-weight:600;border:1px solid var(--line);border-radius:6px;padding:7px 10px}
.warn{border:1px solid var(--line);border-left:3px solid var(--live);border-radius:6px;background:var(--surface);padding:10px 12px;font-size:13px;margin-top:10px}
.cta{border:1px solid var(--gold);border-radius:8px;background:var(--surface);padding:12px;margin-top:12px;display:flex;gap:12px;align-items:center;justify-content:space-between}
.cta p{font-size:13px;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border-radius:8px;background:var(--gold-bg);color:var(--on-gold);font-weight:700;white-space:nowrap}
.btn.ghost{background:none;color:var(--fg);border:1px solid var(--line);font-weight:600}
.btn.danger{background:none;color:var(--loss);border:1px solid var(--loss);font-weight:600}
.btn[disabled]{opacity:.5;cursor:default}
.btn.block{display:flex;width:100%}

/* fight card */
.seg{margin:20px 0 8px}
.fight{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:10px;overflow:hidden}
.fh{display:flex;align-items:center;gap:6px 10px;flex-wrap:wrap;padding:10px 12px 2px;font-size:12px;color:var(--muted)}
.tag{font-weight:700;color:var(--gold);letter-spacing:.07em;text-transform:uppercase;font-size:11px}
.chip{margin-left:auto;font-weight:600;font-size:12px;display:inline-flex;align-items:center;gap:6px}
.chip.live{color:var(--live)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--live);animation:pulse 1.2s infinite;flex:none}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
.row{display:flex;align-items:center;gap:10px;padding:7px 12px}
.corner{width:4px;align-self:stretch;border-radius:2px;background:var(--red);flex:none}
.row.b .corner{background:var(--blue)}
.who{min-width:0;flex:1}
.who b{display:block;font:800 23px/1 var(--font-display);text-transform:uppercase;letter-spacing:.01em;overflow-wrap:anywhere}
.who span{font-size:12px;color:var(--muted)}
.who .w{color:var(--win);font-weight:700}
.result{padding:2px 12px 10px 26px;font-size:13px;color:var(--muted)}
.opt{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:46px;padding:8px 10px;border-radius:8px;background:var(--surface2);min-width:0}
.opt .ol{font-size:13px;line-height:1.2;min-width:0;overflow-wrap:break-word}
.opt .ov{font-weight:700;font-size:15px;white-space:nowrap}
.opt .est{font-style:normal;font-weight:500;color:var(--muted);margin-right:2px}
.opt.on{background:var(--gold-bg);color:var(--on-gold)}
.opt.on .est{color:inherit}
.opt[disabled]{opacity:.55;cursor:default}
.opt.ml{flex:none;min-width:76px;justify-content:center}
.noodds{font-size:12px;color:var(--muted);flex:none}
.more{display:flex;width:100%;justify-content:space-between;align-items:center;padding:11px 12px;border-top:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted);margin-top:4px}
.mk{padding:0 12px 14px;border-top:1px solid var(--line)}
.mk h4{margin:14px 0 7px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-weight:400}
.mk h4 em{font-style:normal;font-size:12px;color:var(--muted)}
.grid{display:grid;gap:6px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
.g3 .opt{flex-direction:column;align-items:flex-start;justify-content:center;gap:2px}
.colh{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;gap:6px;min-width:0;overflow-wrap:anywhere}
.colh i{width:8px;height:8px;border-radius:2px;background:var(--red);flex:none}
.colh.b i{background:var(--blue)}
.legend{font-size:12px;color:var(--muted);margin-top:14px}

/* tab bar + slip bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .wrap{display:grid;grid-template-columns:repeat(3,1fr);height:58px;padding-inline:0}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);position:relative}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--fg)}
.tab.on::after{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;background:var(--gold-bg);border-radius:0 0 3px 3px}
.badge{position:absolute;top:6px;left:calc(50% + 8px);min-width:18px;height:18px;border-radius:9px;background:var(--gold-bg);color:var(--on-gold);font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}
.slipbar{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom,0px));z-index:29;padding-block:8px}
.slipbar button{display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;background:var(--gold-bg);color:var(--on-gold);border-radius:10px;padding:13px 14px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.28)}

/* sheet */
.sheet{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;justify-content:flex-end;background:var(--shade)}
.panel{background:var(--surface);border-radius:16px 16px 0 0;max-height:92dvh;overflow:auto;padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px));width:100%;max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.ph{display:flex;align-items:center;justify-content:space-between}
.ph h3{font:800 26px/1 var(--font-display);text-transform:uppercase}
.x{width:40px;height:40px;display:grid;place-items:center;border-radius:8px;font-size:22px;color:var(--muted)}
.segm{display:grid;grid-template-columns:1fr 1fr;background:var(--surface2);border-radius:8px;padding:3px}
.segm button{min-height:38px;border-radius:6px;font-weight:600;text-align:center;color:var(--muted)}
.segm button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.18)}
.segm button[disabled]{opacity:.45;cursor:default}
.sel{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.sel .t{flex:1;min-width:0}
.sel .t b{display:block;font-weight:600}
.sel .t span{display:block;font-size:12px;color:var(--muted)}
.sel .o{font-weight:700;white-space:nowrap;padding-top:1px}
.sel .bad{color:var(--loss);font-size:12px;font-weight:600}
.combo{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 10px;margin:8px 0;border-radius:8px;background:var(--surface2);font-size:13px;font-weight:600}
.combo b{white-space:nowrap}
.combo.bad{color:var(--loss)}
.field{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:0 12px;background:var(--bg)}
.field span{color:var(--muted);font-weight:600}
.field input{flex:1;min-width:0;border:0;background:none;height:48px;font-size:18px;font-weight:600;outline:none}
.field:focus-within{border-color:var(--gold)}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{flex:1 1 auto;min-height:38px;padding:0 12px;border-radius:8px;border:1px solid var(--line);font-weight:600;font-size:13px;text-align:center}
.sum{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14px}
.sum dt{color:var(--muted)}.sum dd{margin:0;text-align:right;font-weight:600}
.sum .big{font-size:17px;font-weight:700}
.msg{font-size:13px;color:var(--loss);font-weight:600}
.hint{font-size:12px;color:var(--muted)}

/* bets */
.filter{display:grid;grid-template-columns:1fr 1fr;background:var(--surface2);border-radius:8px;padding:3px;margin-bottom:12px}
.filter button{min-height:38px;border-radius:6px;font-weight:600;text-align:center;color:var(--muted)}
.filter button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.18)}
.bet{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:10px;padding:12px}
.bet .bh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.bet .bh b{font:800 20px/1 var(--font-display);text-transform:uppercase;letter-spacing:.01em}
.pill{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:20px;padding:4px 9px;border:1px solid currentColor;white-space:nowrap}
.co{margin-top:10px}
.pill.cashed{color:var(--gold)}
.pill.open{color:var(--muted)}.pill.won{color:var(--win)}.pill.lost{color:var(--loss)}.pill.void{color:var(--muted)}.pill.live{color:var(--live)}
.leg{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.leg .g{width:20px;height:20px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:12px;font-weight:700;border:1.5px solid var(--line);color:var(--muted);margin-top:1px}
.leg .g.won{background:var(--win);border-color:var(--win);color:var(--surface)}
.leg .g.lost{background:var(--loss);border-color:var(--loss);color:var(--surface)}
.leg .g.live{border-color:var(--live);color:var(--live)}
.leg .t{flex:1;min-width:0}
.leg .t b{display:block;font-weight:600}
.leg .t span{display:block;font-size:12px;color:var(--muted)}
.leg .t .lv{color:var(--live);font-weight:600}
.leg .o{font-weight:700;white-space:nowrap}
.bf{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid var(--line);padding-top:10px;margin-top:2px}
.bf div{min-width:0}
.bf small{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.bf b{font-weight:700;overflow-wrap:anywhere}
.pos{color:var(--win)}.neg{color:var(--loss)}
.when{font-size:11px;color:var(--muted);margin-top:8px}

/* wallet */
.hero{padding:6px 0 14px}
.hero .n{font:800 52px/1 var(--font-display);letter-spacing:.01em;overflow-wrap:anywhere}
.hero p{color:var(--muted);font-size:13px;margin-top:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px;display:flex;flex-direction:column;gap:10px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:460px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpis div{min-width:0}
.kpis small{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kpis b{font-size:16px;font-weight:700;overflow-wrap:anywhere}
.pnl{font:800 40px/1 var(--font-display);overflow-wrap:anywhere}
.chart{position:relative}
.chart{min-height:200px}
.chart svg{display:block;max-width:100%;touch-action:pan-y}
.tip{position:absolute;top:0;pointer-events:none;background:var(--fg);color:var(--bg);font-size:12px;font-weight:600;padding:5px 8px;border-radius:6px;white-space:nowrap;transform:translateX(-50%)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font:600 11px/1.2 var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:right;padding:6px 0 6px 12px;white-space:nowrap}
td{text-align:right;padding:8px 0 8px 12px;border-top:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left;padding-left:0;white-space:normal}
textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:10px;font-size:16px;resize:vertical}
.rowbtns{display:flex;gap:8px;flex-wrap:wrap}
.rowbtns .btn{flex:1 1 140px}
.dep{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-top:1px solid var(--line)}
.toast{position:fixed;left:16px;right:16px;top:calc(66px + env(safe-area-inset-top,0px));z-index:60;margin:0 auto;max-width:520px;background:var(--fg);color:var(--bg);border-radius:10px;padding:12px 14px;font-weight:600;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
</style>

<body>
<header class="top"><div class="wrap">
  <div class="brand"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.3 2.5h7.4l5.8 5.8v7.4l-5.8 5.8H8.3l-5.8-5.8V8.3z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><path d="M10 7h4l3 3v4l-3 3h-4l-3-3v-4z" fill="currentColor"/></svg>Oito Lados</div>
  <span class="fake">dinheiro fictício</span>
  <button class="bal" data-act="tab" data-tab="carteira" aria-label="Abrir carteira"><small>Saldo fictício</small><b id="bal">R$ 0,00</b></button>
</div></header>

<main><div class="wrap" id="view"></div></main>

<div class="slipbar" id="slipbar" hidden><div class="wrap"><button data-act="sheet" id="slipbtn"></button></div></div>
<nav class="tabbar"><div class="wrap" id="tabs"></div></nav>
<div class="sheet" id="sheet" hidden><div class="panel" id="panel" role="dialog" aria-label="Cupom de apostas"></div></div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(() => {
'use strict';

/* ================= CORE: odds maths, pricing model, settlement (pure, no DOM) ================= */
const Core = (() => {
  const r2 = x => Math.round((x + Number.EPSILON) * 100) / 100;
  const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
  const parseAm = v => {
    if (v == null) return null;
    if (typeof v === 'number') return v;
    const s = String(v).trim();
    if (/^ev/i.test(s)) return 100;
    const n = parseFloat(s.replace('+', ''));
    return isFinite(n) ? n : null;
  };
  const am2dec = v => { const am = parseAm(v); if (!am) return null; return r2(am > 0 ? 1 + am / 100 : 1 + 100 / Math.abs(am)); };
  const devig = odds => { const q = odds.map(o => 1 / o); const s = q.reduce((a, b) => a + b, 0); return q.map(x => x / s); };
  const MARGIN = 1.07;
  const mo = p => (!(p > 0.004) ? null : clamp(r2(1 / (p * MARGIN)), 1.02, 51));

  // historical finish mix by division: [KO/TKO, submission, decision]. Only used when the book has no method line.
  const DIV = {
    'Heavyweight': [.48, .12, .40], 'Light Heavyweight': [.42, .14, .44], 'Middleweight': [.36, .17, .47],
    'Welterweight': [.31, .16, .53], 'Lightweight': [.27, .19, .54], 'Featherweight': [.26, .17, .57],
    'Bantamweight': [.24, .17, .59], 'Flyweight': [.20, .20, .60], 'W Featherweight': [.22, .15, .63],
    'W Bantamweight': [.18, .17, .65], 'W Flyweight': [.13, .17, .70], 'W Strawweight': [.10, .17, .73],
    _: [.28, .17, .55]
  };
  function baseMix(f) {
    let b = DIV[f.weight] || DIV._;
    if (f.rounds >= 5) { const d = b[2] * 0.88, k = (1 - d) / (1 - b[2]); b = [b[0] * k, b[1] * k, d]; }
    return b;
  }

  /* ---------- normalising ESPN payloads ---------- */
  function lastName(x) {
    const s = (x.athlete && x.athlete.shortName) || '';
    const n = s.replace(/^\S+\.\s*/, '').trim();
    if (n) return n;
    const full = (x.athlete && (x.athlete.displayName || x.athlete.fullName)) || '';
    return full.split(' ').slice(-1)[0] || full;
  }
  function normFight(c, e, i) {
    const cs = [...(c.competitors || [])].sort((x, y) => (x.order || 0) - (y.order || 0));
    if (cs.length < 2) return null;
    const mk = x => ({
      id: String(x.id), name: (x.athlete && (x.athlete.displayName || x.athlete.fullName)) || 'A definir',
      last: lastName(x), country: (x.athlete && x.athlete.flag && x.athlete.flag.alt) || '',
      record: (x.records && x.records[0] && x.records[0].summary) || '', winner: x.winner === true
    });
    const a = mk(cs[0]), b = mk(cs[1]);
    const st = c.status || {}, ty = st.type || {};
    const canceled = /CANCEL|POSTPON|FORFEIT/i.test(ty.name || '');
    return {
      id: String(c.id), eventId: String(e.id), eventName: e.name || '', date: Date.parse(c.date || e.date), idx: i,
      weight: (c.type && (c.type.abbreviation || c.type.text)) || '', rounds: (c.format && c.format.regulation && c.format.regulation.periods) || 3,
      a, b, state: canceled ? 'post' : (ty.state || 'pre'), canceled, period: st.period || 0, clock: st.displayClock || '',
      winner: a.winner ? 'a' : (b.winner ? 'b' : null)
    };
  }
  function normEvent(e) {
    const fights = (e.competitions || []).map((c, i) => normFight(c, e, i)).filter(Boolean);
    const t = (e.status && e.status.type) || {};
    const completed = !!(t.completed || t.state === 'post' || /FINAL/i.test(t.name || ''));
    return { id: String(e.id), name: e.name || '', date: Date.parse(e.date), completed, fights };
  }
  function normOdds(j, f) {
    const it = ((j && j.items) || []).find(x => x && x.homeAthleteOdds && x.awayAthleteOdds);
    if (!it) return null;
    const idOf = o => (String((o.athlete && o.athlete.$ref) || '').match(/athletes\/(\d+)/) || [])[1];
    const side = {};
    for (const o of [it.homeAthleteOdds, it.awayAthleteOdds]) { const id = idOf(o); if (id === f.a.id) side.a = o; else if (id === f.b.id) side.b = o; }
    if (!side.a || !side.b) return null;
    const cur = o => o.current || {};
    const ml = o => am2dec(o.moneyLine != null ? o.moneyLine : (cur(o).moneyLine || {}).american);
    const mA = ml(side.a), mB = ml(side.b);
    if (!mA || !mB) return null;
    const vm = o => {
      const v = cur(o).victoryMethod; if (!v) return null;
      const r = { ko: am2dec((v.koTkoDq || {}).american), sub: am2dec((v.submission || {}).american), dec: am2dec((v.points || {}).american) };
      return (r.ko && r.sub && r.dec) ? r : null;
    };
    const meA = vm(side.a), meB = vm(side.b);
    const line = Number(it.overUnder), ov = am2dec(it.overOdds), un = am2dec(it.underOdds);
    const total = (line > 0 && line < f.rounds && Math.abs(line % 1 - 0.5) < 1e-9 && ov && un) ? { line, over: ov, under: un } : null;
    return { book: (it.provider && it.provider.name) || 'casa', props: String((it.propBets && it.propBets.$ref) || '').replace(/^http:/, 'https:'), ml: { a: mA, b: mB }, method: (meA && meB) ? { a: meA, b: meB } : null, total, dist: null, ts: Date.now() };
  }
  // "Fight To Go The Distance" arrives as two unlabeled prices; the one whose fair probability sits closer to the
  // decision probability implied by the method-of-victory lines is the "yes".
  function attachDistance(o, f, j) {
    const xs = ((j && j.items) || []).filter(x => x && x.type && /distance/i.test(x.type.name || ''))
      .map(x => am2dec(x.odds && x.odds.american && x.odds.american.value)).filter(Boolean);
    if (xs.length !== 2 || !o.method) return o;
    const q = devig([o.method.a.ko, o.method.a.sub, o.method.a.dec, o.method.b.ko, o.method.b.sub, o.method.b.dec]);
    const pDec = q[2] + q[5], p0 = devig(xs)[0];
    o.dist = Math.abs(p0 - pDec) <= Math.abs((1 - p0) - pDec) ? { yes: xs[0], no: xs[1] } : { yes: xs[1], no: xs[0] };
    return o;
  }
  function normResult(s) {
    const r = s && s.result;
    if (!r) return null;
    const nm = ((r.name || '') + ' ' + (r.displayName || '')).toLowerCase();
    let method = 'unknown';
    if (/no.?contest|overturn/.test(nm)) method = 'nc';
    else if (/draw/.test(nm)) method = 'draw';
    else if (/sub/.test(nm)) method = 'sub';
    else if (/dec/.test(nm)) method = 'dec';
    else if (/ko|dq|disq|stoppage|retire/.test(nm)) method = 'ko';
    // time elapsed in the final round: the displayed clock ("3:26") is what the result is published with; the numeric clock is the fallback
    const mm = /^(\d+):(\d{2})$/.exec(String(s.displayClock || '').trim());
    const time = mm ? (+mm[1]) * 60 + (+mm[2]) : (typeof s.clock === 'number' ? s.clock : null);
    return { method, label: r.displayName || '', desc: r.displayDescription || r.description || '', round: s.period || 0, time, clock: s.displayClock || '' };
  }
  function statValue(j, name) {
    const cats = (j && j.splits && j.splits.categories) || [];
    for (const c of cats) for (const s of (c.stats || [])) if (s.name === name && typeof s.value === 'number') return s.value;
    return null;
  }

  /* ---------- pricing ---------- */
  const shares = (g, R) => { const a = []; let t = 0; for (let r = 0; r < R; r++) { a.push(Math.pow(g, r)); t += a[r]; } return a.map(x => x / t); };
  // share of finishes that happen before the X.5 mark (halfway through round ceil(X.5))
  const cumShare = (sh, L) => { const c = Math.ceil(L); let x = 0; for (let r = 1; r < c; r++) x += sh[r - 1] || 0; return x + 0.5 * (sh[c - 1] || 0); };
  function probs(f, o) {
    const [pa, pb] = devig([o.ml.a, o.ml.b]);
    const base = baseMix(f);
    let M;
    if (o.method) {
      const q = devig([o.method.a.ko, o.method.a.sub, o.method.a.dec, o.method.b.ko, o.method.b.sub, o.method.b.dec]);
      M = { a: { ko: q[0], sub: q[1], dec: q[2] }, b: { ko: q[3], sub: q[4], dec: q[5] } };
    } else {
      M = { a: { ko: pa * base[0], sub: pa * base[1], dec: pa * base[2] }, b: { ko: pb * base[0], sub: pb * base[1], dec: pb * base[2] } };
    }
    let pDec = M.a.dec + M.b.dec;
    if (o.dist) {
      const py = devig([o.dist.yes, o.dist.no])[0];
      if (py > 0.02 && py < 0.98 && pDec > 0 && pDec < 1) {
        const kd = py / pDec, kf = (1 - py) / (1 - pDec);
        for (const s of ['a', 'b']) { M[s].dec *= kd; M[s].ko *= kf; M[s].sub *= kf; }
        pDec = py;
      }
    }
    const F = 1 - pDec, R = f.rounds;
    let g = 0.7;                                   // each round holds ~70% of the finishes of the one before
    if (o.total && F > 0.02) {                     // ...unless the book's total-rounds line says otherwise
      const target = devig([o.total.over, o.total.under])[1] / F;
      if (target > 0.02 && target < 0.99) {
        let lo = 0.15, hi = 3;
        for (let i = 0; i < 40; i++) { const mid = (lo + hi) / 2; if (cumShare(shares(mid, R), o.total.line) > target) lo = mid; else hi = mid; }
        g = (lo + hi) / 2;
      }
    }
    return { pa, pb, M, pDec, F, R, sh: shares(g, R) };
  }
  // negative binomial: takedown counts are burstier than Poisson
  function nbCdf(k, lam, r) {
    if (lam <= 0) return 1;
    let p = Math.pow(r / (r + lam), r), c = p;
    for (let i = 0; i < k; i++) { p = p * (i + r) / (i + 1) * (lam / (r + lam)); c += p; }
    return Math.min(1, c);
  }
  // takedowns landed per 15 min. ESPN reports 0 both for pure strikers and for fighters with no UFC minutes yet, so 0 gets a low prior rather than "never".
  const tdRate = x => (x && typeof x.tdAvg === 'number' && x.tdAvg > 0) ? clamp(x.tdAvg, 0.15, 5) : (x && x.tdAvg === 0) ? 0.5 : 0.9;
  function nbPmf(lam, r, K) {
    const out = new Array(K + 1); let p = lam <= 0 ? 1 : Math.pow(r / (r + lam), r); out[0] = p;
    for (let i = 0; i < K; i++) { p = lam <= 0 ? 0 : p * (i + r) / (i + 1) * (lam / (r + lam)); out[i + 1] = p; }
    return out;
  }
  // what a non-takedown selection requires of a fight ending {w: winner, m: method, r: round, late: second half of that round}
  function pred(q) {
    const p1 = q[1], p2 = q[2];
    switch (q[0]) {
      case 'ml': return a => a.w === p1;
      case 'mov': return a => a.w === p1 && a.m === p2;
      case 'fm': return a => a.m === p1;
      case 'dist': return a => (a.m === 'dec') === (p1 === 'yes');
      case 'tot': { const c = Math.ceil(+p2), over = p1 === 'o'; return a => (a.m === 'dec' || a.r > c || (a.r === c && a.late)) === over; }
      case 'rnd': return a => a.m !== 'dec' && a.r === +p1;
      case 'wr': return a => a.m !== 'dec' && a.w === p1 && a.r === +p2;
    }
    return null;
  }
  const tdOk = (q, i, j) => q[0] === 'td' ? ((i + j > +q[2]) === (q[1] === 'o')) : (((q[1] === 'a' ? i : j) >= 1) === (q[2] === 'yes'));
  // Joint model of one fight: every way it can end (who, how, which round, which half of the round) with its probability,
  // plus takedown counts that grow with how long that ending lets the fight run. Selections from the same fight are
  // priced from the probability that all of them happen together, never by multiplying their odds.
  function jointModel(P, st) {
    const atoms = [];
    for (const w of ['a', 'b']) {

  ui.cashing = true; ui.cashMsg = ''; render();

/* ================= sync loop ================= */
let busy = false, timer = null;
async function sync(force) {
  if (busy) return; busy = true;
  try {
    await loadBoard();
    D.err = null; D.lastSync = Date.now();
    pickEvent(); render();
    await Promise.all([loadOdds(ui.eventId, force), loadResults()]);
    const other = [...new Set(slip.sels.map(s => D.fights.get(s.fid)).filter(f => f && f.eventId !== ui.eventId).map(f => f.eventId))];
    for (const eid of other) await loadOdds(eid, force);
    settle(); saveCache();
  } catch (e) { D.err = (e && e.name === 'AbortError') ? 'tempo esgotado' : String((e && e.message) || e); }
  finally { busy = false; render(); schedule(); }
}
function schedule() {
  clearTimeout(timer);
  if (document.hidden) return;
  const now = Date.now(), fs = [...D.fights.values()];
  const live = fs.some(f => f.state === 'in');
  const night = D.events.some(e => !e.completed && now > e.date - H && now < e.date + 12 * H);
  timer = setTimeout(() => sync(false), live ? 15e3 : night ? 30e3 : 120e3);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) sync(false); else clearTimeout(timer); });
function pickEvent() {
  const evs = shownEvents();
  if (evs.find(e => e.id === ui.eventId)) return;
  const now = Date.now();
  const next = evs.find(e => !e.completed && e.date > now - 14 * H) || evs[evs.length - 1];

const shownEvents = () => D.events.filter(e => e.date > Date.now() - 5 * DAY && !/Contender Series/i.test(e.name));

/* ================= helpers over state ================= */
const sum = (xs, f) => xs.reduce((a, x) => a + f(x), 0);
function wallet() {
  const dep = sum(S.deposits, d => d.v), open = openBets(), done = S.bets.filter(b => b.status !== 'open');
  const staked = sum(done, b => b.stake), ret = sum(done, b => b.payout);
  const decided = done.filter(b => b.status === 'won' || b.status === 'lost'), won = decided.filter(b => b.status === 'won').length;   // voided and cashed-out bets are not hits or misses
  return { dep, open, done, atRisk: sum(open, b => b.stake), staked, ret, pnl: Core.r2(ret - staked), decided: decided.length, won,
    balance: Core.r2(dep - sum(S.bets, b => b.stake) + ret) };
}
const statsFor = f => ({ a: D.astats[f.a.id], b: D.astats[f.b.id] });
const canBet = f => f.state === 'pre' && !f.canceled && !!D.odds[f.id] && Date.now() < f.date + 8 * H;
const priced = new Map();
function priceOf(f) {
  const o = D.odds[f.id]; if (!o) return null;

  const sig = [o.ts, sa ? sa.ts : 0, sb ? sb.ts : 0, f.rounds, f.a.id, f.b.id].join('|');

  if (c && c.sig === sig) return c.p;

}

    return { s, f, x, ok: !!x };

}

function breakdown(done, keyOf) {
  const m = new Map();
  for (const b of done) { const k = keyOf(b); const r = m.get(k) || { k, n: 0, st: 0, ret: 0 }; r.n++; r.st += b.stake; r.ret += b.payout; m.set(k, r); }
  return [...m.values()].sort((a, b) => b.st - a.st);
}
function tblHtml(title, rows) {
  return `<div class="tbl"><table><thead><tr><th>${title}</th><th>Apostas</th><th>Apostado</th><th>Resultado</th></tr></thead><tbody>${rows.map(r => { const p = r.ret - r.st; return `<tr><td>${esc(r.k)}</td><td>${r.n}</td><td>${money(r.st)}</td><td class="${p > 0.004 ? 'pos' : p < -0.004 ? 'neg' : ''}">${signed(p)}</td></tr>`; }).join('')}</tbody></table></div>`;
}
function vCarteira(w) {
  let h = `<section class="hero"><span class="label">Saldo fictício</span><div class="n">${money(w.balance)}</div><p>${w.open.length ? `${money(w.atRisk)} em jogo em ${w.open.length} ${w.open.length > 1 ? 'apostas abertas' : 'aposta aberta'} · ` : ''}${money(w.dep)} depositados no total</p></section>`;
  h += `<section class="card"><span class="label">Depositar dinheiro de mentira</span>
    <div class="field"><span>R$</span><input id="dep" inputmode="decimal" autocomplete="off" placeholder="0,00" value="${esc(ui.dep)}" aria-label="Valor do depósito"></div>
    <div class="quick">${[100, 500, 1000, 5000].map(v => `<button data-act="depq" data-v="${v}">${brl.format(v).replace(',00', '')}</button>`).join('')}</div>
    <button class="btn block" data-act="deposit">Depositar</button></section>`;
  const roi = w.staked ? w.pnl / w.staked * 100 : null;
  h += `<section class="card"><span class="label">Ganhos e perdas · apostas encerradas</span>
    <div class="pnl ${w.pnl > 0 ? 'pos' : w.pnl < 0 ? 'neg' : ''}">${signed(w.pnl)}</div>
    <div class="kpis"><div><small>Apostado</small><b>${money(w.staked)}</b></div><div><small>Retornado</small><b>${money(w.ret)}</b></div><div><small>ROI</small><b>${roi == null ? '—' : (roi > 0 ? '+' : '') + roi.toFixed(1).replace('.', ',') + '%'}</b></div><div><small>Acerto</small><b>${w.decided ? `${w.won}/${w.decided} · ${Math.round(w.won / w.decided * 100)}%` : '—'}</b></div></div>`;
  if (w.done.length) {
    h += `<span class="label">Resultado acumulado, aposta a aposta</span><div class="chart" id="chart"></div>`;
    h += tblHtml('Mercado', breakdown(w.done, b => isCombo(b) ? 'Combinada' : b.type === 'multi' ? 'Múltipla' : b.legs[0].cat));
    h += tblHtml('Evento', breakdown(w.done, b => { const s = new Set(b.legs.map(l => l.event)); return s.size === 1 ? evLabel({ name: [...s][0] }).main : 'Vários eventos'; }));
  } else h += '<p class="hint">O gráfico e a quebra por mercado aparecem quando a primeira aposta for encerrada.</p>';
  h += '</section>';
  if (S.deposits.length) h += `<section class="card"><span class="label">Depósitos</span><div>${S.deposits.slice().reverse().slice(0, 8).map(d => `<div class="dep"><span>${esc(dWhen.format(d.t))}</span><b>${money(d.v)}</b></div>`).join('')}</div></section>`;
  h += `<section class="card"><span class="label">Seus dados</span><p class="hint">Saldo e apostas ficam salvos só neste aparelho. Guarda um backup de vez em quando: o Safari pode limpar dados de sites que você passa muito tempo sem abrir.</p>
    <div class="rowbtns"><button class="btn ghost" data-act="backup">Copiar backup</button><button class="btn ghost" data-act="restore">${ui.restore ? 'Cancelar' : 'Restaurar backup'}</button></div>`;
  if (ui.backup) h += `<textarea id="bk" readonly aria-label="Backup">${esc(ui.backup)}</textarea><p class="hint">Não deu pra copiar sozinho. Seleciona o texto acima e copia.</p>`;
  if (ui.restore) h += `<textarea id="rs" placeholder="Cola aqui o backup" aria-label="Backup para restaurar"></textarea><button class="btn block" data-act="dorestore">Restaurar e substituir tudo</button>`;
  h += ui.reset ? `<p class="msg">Isso apaga saldo, depósitos e todas as apostas deste aparelho.</p><div class="rowbtns"><button class="btn danger" data-act="doreset">Apagar tudo</button><button class="btn ghost" data-act="reset">Manter</button></div>`
    : `<button class="btn danger block" data-act="reset">Zerar simulação</button>`;
  return h + '</section>';
}

function renderSheet() {
  const sh = $('#sheet'); sh.hidden = !ui.sheet;
  if (!ui.sheet) { renderSlipBar(); return; }
  const c = slipCalc();
  let h = `<div class="ph"><h3>Cupom</h3><button class="x" data-act="sheet" aria-label="Fechar cupom">×</button></div>`;
  if (!c.n) { $('#panel').innerHTML = h + '<p class="empty">Cupom vazio.</p>'; return; }
  const mname = c.sameFight ? 'Combinada' : 'Múltipla';
  h += `<div class="segm"><button class="${slip.mode === 'single' ? 'on' : ''}" data-act="mode" data-m="single">${c.n > 1 ? `Simples (${c.n})` : 'Simples'}</button><button class="${slip.mode === 'multi' ? 'on' : ''}" data-act="mode" data-m="multi" ${c.multiOk ? '' : 'disabled'}>${mname}</button></div>`;
  h += '<div>';
  for (const g of c.groups) {
    const f = g.f, names = f ? `${f.a.last} x ${f.b.last}` : 'Luta fora do card';
    for (const r of g.rs)
      h += `<div class="sel"><div class="t">${r.ok ? `<b>${esc(r.x.sel)}</b><span>${esc(r.x.market)} · ${esc(names)}</span>` : `<b>${esc(names)}</b><span class="bad">Mercado fechado. Remove pra continuar.</span>`}</div>${r.ok ? `<span class="o">${r.x.src === 'est' ? '≈' : ''}${fo(r.x.odd)}</span>` : ''}<button class="x" data-act="unpick" data-fid="${esc(r.s.fid)}" data-key="${esc(r.s.key)}" aria-label="Remover seleção">×</button></div>`;
    if (g.combo && !g.ok) h += `<div class="combo bad"><span>${g.why === 'impossible' ? `As seleções de ${esc(names)} não podem acontecer juntas. Tira uma pra combinar.` : `Em ${esc(names)}, uma seleção já garante a outra. Tira uma pra combinar.`}</span></div>`;
    else if (g.combo && slip.mode === 'multi') h += `<div class="combo"><span>Juntas em ${esc(names)}${g.same ? ` · mesmo que "${esc(g.same)}"` : ''}</span><b>${g.same ? '' : '≈'}${fo(g.odd)}</b></div>`;
  }
  h += '</div>';
  if (slip.mode === 'multi' && c.groups.some(g => g.combo)) h += '<p class="hint">Na mesma luta as odds não se multiplicam: o preço vem da chance de tudo acontecer junto.</p>';
  h += `<label class="label" for="stake">${slip.mode === 'multi' ? 'Valor da ' + mname.toLowerCase() : c.n > 1 ? 'Valor de cada aposta' : 'Valor da aposta'}</label>
    <div class="field"><span>R$</span><input id="stake" inputmode="decimal" autocomplete="off" placeholder="0,00" value="${esc(slip.stake)}"></div>
    <div class="quick">${[10, 50, 100].map(v => `<button data-act="stq" data-v="${v}">+${v}</button>`).join('')}<button data-act="stq" data-v="max">Tudo</button></div>
    <div id="slipsum"></div>`;
  $('#panel').innerHTML = h;
  slipSummary();
}
function slipSummary() {
  const c = slipCalc(), el = $('#slipsum'); if (!el) return;
  let why = '';
  if (!c.ok) why = 'Tem seleção com mercado fechado.';
  else if (c.stake < 1) why = 'Aposta mínima de R$ 1,00.';
  else if (c.total > c.balance + 0.004) why = 'Saldo insuficiente.';
  el.innerHTML = `<dl class="sum">${slip.mode === 'multi' ? `<dt>Odd da ${c.sameFight ? 'combinada' : 'múltipla'}</dt><dd>${c.ok ? fo(c.odd) : '—'}</dd>` : ''}<dt>Total apostado</dt><dd>${money(c.total)}</dd><dt>Retorno possível</dt><dd class="big">${money(c.ret)}</dd><dt>Saldo disponível</dt><dd>${money(c.balance)}</dd></dl>
    ${ui.msg ? `<p class="msg" style="margin-top:10px">${esc(ui.msg)}</p>` : ''}
    ${why === 'Saldo insuficiente.' ? `<p class="msg" style="margin-top:10px">Saldo insuficiente. <button data-act="tab" data-tab="carteira" style="text-decoration:underline">Depositar</button></p>` : ''}
    <button class="btn block" style="margin-top:12px" data-act="place" ${why || ui.placing ? 'disabled' : ''}>${ui.placing ? 'Confirmando odds na ESPN…' : why && why !== 'Saldo insuficiente.' ? esc(why) : 'Apostar ' + money(c.total)}</button>`;
}

async function place() {
  if (ui.placing) return;
  const before = slipCalc();
  if (!before.ok || before.stake < 1 || before.total > before.balance + 0.004) return;
  const shown = new Map(before.rs.map(r => [r.s.fid + '|' + r.s.key, r.x.odd])), mode = slip.mode;
  ui.placing = true; ui.msg = ''; slipSummary();
  try {
    // re-check with the source right before taking the bet: the fight may have started or the line may have moved
    await loadBoard();
    const byEv = new Map();
    for (const s of slip.sels) { const f = D.fights.get(s.fid); if (f) byEv.set(f.eventId, [...(byEv.get(f.eventId) || []), f.id]); }
    for (const [eid, fids] of byEv) await loadOdds(eid, true, fids);
    D.lastSync = Date.now(); D.err = null;
  } catch (e) {
    ui.placing = false; ui.msg = 'Sem conexão com a ESPN. Não deu pra confirmar as odds, tenta de novo.'; renderSheet(); return;
  }
  ui.placing = false;
  const c = slipCalc();
  if (!c.ok) { ui.msg = 'Uma das lutas já começou ou saiu do card.'; renderSheet(); render(); return; }
  if (slip.mode !== mode) { ui.msg = 'Essa combinação não está mais disponível com as odds novas.'; renderSheet(); render(); return; }
  if (c.rs.some(r => Math.abs(r.x.odd - shown.get(r.s.fid + '|' + r.s.key)) > 0.001) || (mode === 'multi' && Math.abs(c.odd - before.odd) > 0.001)) { ui.msg = 'As odds mudaram. Confere os valores novos e confirma de novo.'; renderSheet(); render(); return; }
  if (c.total > c.balance + 0.004) { renderSheet(); return; }
  const now = Date.now();
  const leg = r => ({ fid: r.f.id, eid: r.f.eventId, key: r.s.key, market: r.x.market, sel: r.x.sel, cat: r.x.cat, fight: `${r.f.a.last} x ${r.f.b.last}`, event: r.f.eventName, date: r.f.date, odd: r.x.odd, src: r.x.src, out: null });
  const mk = (type, legs, i, odd, sgp) => ({ id: 'b' + now.toString(36) + i + Math.random().toString(36).slice(2, 6), t: now, type, stake: c.stake, odd, sgp, legs, status: 'open', payout: 0, settledAt: null });
  if (slip.mode === 'multi') {
    const sgp = {}; for (const g of c.groups) if (g.combo) sgp[g.fid] = g.odd;      // price of each same-fight combo, fixed at placement
    S.bets.push(mk('multi', c.rs.map(leg), 0, c.odd, sgp));
  } else c.rs.forEach((r, i) => S.bets.push(mk('single', [leg(r)], i, r.x.odd, null)));
  saveS(); saveCache();
  const made = slip.mode === 'multi' ? 1 : c.n;
  slip.sels = []; slip.stake = ''; slip.mode = 'single'; ui.sheet = false; ui.msg = ''; ui.tab = 'apostas'; ui.filter = 'open';
  renderSheet(); render(); window.scrollTo(0, 0);
  toast(made > 1 ? `${made} apostas feitas. Boa sorte.` : 'Aposta feita. Boa sorte.');
}

/* ================= events ================= */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) { if (e.target.id === 'sheet') { ui.sheet = false; renderSheet(); } return; }
  const a = b.dataset.act;
  if (a === 'tab') { ui.tab = b.dataset.tab; ui.sheet = false; ui.reset = false; ui.cash = null; renderSheet(); if (document.activeElement) document.activeElement.blur(); render(); window.scrollTo(0, 0); }
  else if (a === 'event') { ui.eventId = b.dataset.id; render(); loadOdds(ui.eventId, false).then(() => { saveCache(); render(); }); }
  else if (a === 'refresh') { sync(true); render(); }
  else if (a === 'more') { const id = b.dataset.fid; ui.open.has(id) ? ui.open.delete(id) : ui.open.add(id); render(); }
  else if (a === 'pick') {
    const fid = b.dataset.fid, key = b.dataset.key, g = key.split(':')[0];
    const i = slip.sels.findIndex(s => s.fid === fid && s.key === key);
    if (i >= 0) slip.sels.splice(i, 1);
    else { slip.sels = slip.sels.filter(s => !(s.fid === fid && s.key.split(':')[0] === g)); slip.sels.push({ fid, key }); }
    ui.msg = ''; render();
  }
  else if (a === 'unpick') { slip.sels = slip.sels.filter(s => !(s.fid === b.dataset.fid && s.key === b.dataset.key)); ui.msg = ''; if (!slip.sels.length) ui.sheet = false; renderSheet(); render(); }
  else if (a === 'sheet') { ui.sheet = !ui.sheet; ui.msg = ''; renderSheet(); }
  else if (a === 'mode') { slip.mode = b.dataset.m; renderSheet(); }
  else if (a === 'stq') { const bal = wallet().balance, n = slip.mode === 'multi' ? 1 : Math.max(1, slip.sels.length); const v = b.dataset.v === 'max' ? Math.floor(bal / n * 100) / 100 : parseMoney(slip.stake) + Number(b.dataset.v); slip.stake = v ? String(v).replace('.', ',') : ''; const el = $('#stake'); if (el) el.value = slip.stake; slipSummary(); }
  else if (a === 'place') place();
  else if (a === 'filter') { ui.filter = b.dataset.f; ui.cash = null; render(); }
  else if (a === 'cash') { ui.cash = b.dataset.id || null; ui.cashMsg = ''; render(); }
  else if (a === 'docash') doCashout(b.dataset.id);
  else if (a === 'depq') { ui.dep = String(parseMoney(ui.dep) + Number(b.dataset.v)).replace('.', ','); const el = $('#dep'); if (el) el.value = ui.dep; }
  else if (a === 'deposit') {
    const v = parseMoney(($('#dep') || {}).value || ui.dep);
    if (!v) { toast('Digita um valor pra depositar.'); return; }
    if (v > 1e9) { toast('Calma, bilionário. Máximo de R$ 1 bilhão por depósito.'); return; }
    S.deposits.push({ t: Date.now(), v }); saveS(); ui.dep = ''; if (document.activeElement) document.activeElement.blur(); render(); toast(`${money(v)} fictícios na conta.`);
  }
  else if (a === 'backup') {
    const txt = JSON.stringify(S);
    const fail = () => { ui.backup = txt; render(); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(() => toast('Backup copiado. Cola nas Notas pra guardar.'), fail); else fail();
  }
  else if (a === 'restore') { ui.restore = !ui.restore; render(); }
  else if (a === 'dorestore') {
    let s = null; try { s = JSON.parse(($('#rs') || {}).value || ''); } catch (err) { /* handled below */ }
    if (!validState(s)) { toast('Esse texto não é um backup válido.'); return; }
    S = { v: 1, deposits: s.deposits.filter(d => d && d.v > 0 && d.t), bets: s.bets.filter(x => x && Array.isArray(x.legs) && x.stake > 0) };
    saveS(); ui.restore = false; if (document.activeElement) document.activeElement.blur(); render(); toast('Backup restaurado.'); sync(true);
  }
  else if (a === 'reset') { ui.reset = !ui.reset; render(); }
  else if (a === 'doreset') { S = { v: 1, deposits: [], bets: [] }; saveS(); slip.sels = []; ui.reset = false; render(); toast('Simulação zerada.'); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'stake') { slip.stake = e.target.value; ui.msg = ''; slipSummary(); }
  else if (e.target.id === 'dep') ui.dep = e.target.value;
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && ui.sheet) { ui.sheet = false; renderSheet(); }
  if (e.key === 'Enter' && e.target.id === 'dep') { const b = document.querySelector('[data-act="deposit"]'); if (b) b.click(); }
});

window.__OL = { Core, D, ui, slip, sync, settle, get S() { return S; } };
pickEvent(); render(); sync(false);
})();
</script>
